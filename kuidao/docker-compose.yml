# Cercana on one machine: app + Postgres/PostGIS + nightly backups.
# Quick start:  cp .env.example .env  →  edit .env  →  docker compose --profile mail up -d
# Optional add-ons (profiles):
#   --profile mail     Mailpit test inbox at http://<host>:8025 (catches all login emails)
#   --profile https    Caddy with automatic HTTPS for your own domain (ports 80/443)
#   --profile tunnel   Cloudflare Tunnel: public URL without opening router ports

name: cercana

services:
  app:
    build: .
    image: cercana-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://cercana:${POSTGRES_PASSWORD}@db:5432/cercana
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3001}:3000"

  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cercana
      POSTGRES_DB: cercana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cercana -d cercana"]
      interval: 5s
      timeout: 5s
      retries: 20

  backup:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/backup.sh"]

  mail:
    image: axllent/mailpit:v1.20
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "8025:8025"

  caddy:
    image: caddy:2.8-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data

  tunnel:
    image: cloudflare/cloudflared:2024.10.0
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
