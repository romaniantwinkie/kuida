<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="timing.js"></script>
<style>
  :root { --blue:#1D4ED8; --sky:#8AB4FF; --soft:#E7EEFD; --ink:#0F141B; --muted:#5D6774; --line:#DFE3E8; --ok:#16964A; --okbg:#E3F4EA; --red:#D22C2C; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; font-family: Inter, sans-serif; color: var(--ink); background: #F3F6FB; }
  #bg { position: absolute; inset: 0; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(110px); }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .abs { position: absolute; }
  .card { background: rgba(255,255,255,.92); border: 1px solid rgba(15,20,27,.06); border-radius: 26px; box-shadow: 0 30px 60px -30px rgba(29,78,216,.25), 0 2px 6px rgba(15,20,27,.05); }
  .kin { font-weight: 600; letter-spacing: -0.035em; color: #1E3A7B; }
  .pill { display: inline-flex; align-items: center; justify-content: center; height: 76px; padding: 0 40px; border-radius: 999px; font-size: 34px; font-weight: 500; white-space: nowrap; border: 2px solid rgba(29,78,216,.25); color: #5B6B8C; background: rgba(255,255,255,.55); }
  .pill.on { background: #fff; color: var(--ink); border-color: #fff; box-shadow: 0 16px 40px -16px rgba(29,78,216,.45); }
  .orb { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff 0%, #DCE8FF 35%, #8AB4FF 70%, #B9E8DC 100%); box-shadow: 0 30px 80px -20px rgba(29,78,216,.45), inset 0 0 0 10px rgba(255,255,255,.55); display: grid; place-items: center; }
  .word { font-weight: 600; letter-spacing: -0.045em; line-height: 1; }
  .dot { color: var(--blue); }
  .shot { position: absolute; border-radius: 22px; overflow: hidden; box-shadow: 0 60px 120px -40px rgba(15,30,80,.45), 0 0 0 1px rgba(15,20,27,.06); background: #fff; }
  .shot img { display: block; width: 100%; }
  .phone { position: absolute; border-radius: 58px; padding: 14px; background: #fff; box-shadow: 0 60px 120px -40px rgba(15,30,80,.5), 0 0 0 1px rgba(15,20,27,.08); }
  .phone img { display: block; width: 100%; border-radius: 44px; }
  .chip { display: inline-flex; align-items: center; gap: 12px; padding: 16px 24px; border-radius: 20px; background: #fff; font-size: 24px; font-weight: 500; box-shadow: 0 24px 48px -20px rgba(15,30,80,.35); white-space: nowrap; }
  .cap { font-size: 22px; color: var(--muted); }
  .avc { position: absolute; border-radius: 50%; overflow: hidden; background: #fff; box-shadow: 0 40px 80px -30px rgba(15,30,80,.45), 0 0 0 8px rgba(255,255,255,.85); }
  .avc img { width: 100%; height: 100%; display: block; }
  .label { position: absolute; font-size: 26px; font-weight: 600; color: #1E3A7B; text-align: center; white-space: nowrap; }
</style>
</head>
<body>
<div id="bg">
  <div class="blob" id="b1" style="width:900px;height:900px;background:rgba(138,180,255,.55)"></div>
  <div class="blob" id="b2" style="width:800px;height:800px;background:rgba(185,232,220,.6)"></div>
  <div class="blob" id="b3" style="width:700px;height:700px;background:rgba(214,226,255,.9)"></div>
</div>
<div id="stage"></div>

<script>
const VID = new URLSearchParams(location.search).get("v") || "agency";
const T = TIMING[VID];
const $ = (s) => document.querySelector(s);
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }; // ease-in-out cubic
const eo = (x) => 1 - Math.pow(1 - clamp(x), 3);
const P = (t, a, d) => eo((t - a) / d);

// Generic enter/exit for any element: blur-to-sharp, rise, scale.
function fx(el, l, inAt, outAt, o = {}) {
  if (!el) return;
  const d = o.d ?? 0.7, dy = o.dy ?? 30, blur = o.blur ?? 16, sc = o.scale ?? 0.98;
  const pin = P(l, inAt, d), pout = outAt == null ? 0 : ease((l - outAt) / 0.5);
  const k = pin * (1 - pout);
  el.style.opacity = k.toFixed(3);
  el.style.filter = `blur(${((1 - pin) * blur + pout * 10).toFixed(1)}px)`;
  const base = o.base || "";
  el.style.transform = `${base} translateY(${((1 - pin) * dy - pout * 20).toFixed(1)}px) scale(${(sc + (1 - sc) * pin + pout * 0.02).toFixed(4)})`;
}
const svgCheck = (c = "#fff", s = 64) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7"/></svg>`;
const cMark = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 32 32"><path d="M19.31 12.19A6.8 6.8 0 1 0 19.31 21.81" fill="none" stroke="#1D4ED8" stroke-width="3.6"/><circle cx="23.6" cy="22.4" r="2.4" fill="#1D4ED8" opacity=".55"/></svg>`;

// ---------- shared scene builders ----------
function sceneOrb(id) {
  return `<div class="scene" id="${id}">
    <div class="orb abs" id="${id}o" style="left:810px;top:390px;width:300px;height:300px">${cMark(150)}</div>
    <div class="abs word" id="${id}w" style="left:0;right:0;top:470px;text-align:center;font-size:120px;opacity:0">Meet cercana<span class="dot">.</span></div>
  </div>`;
}
function renderOrb(id, l, L) {
  const o = $("#" + id + "o"), w = $("#" + id + "w");
  const a = P(l, 0.05, 0.8), m = ease((l - 0.9) / 0.9);
  o.style.opacity = a * (1 - ease((l - (L - 0.5)) / 0.5));
  o.style.transform = `translateX(${-470 * m}px) scale(${(0.6 + 0.4 * a) * (1 - 0.35 * m)}) rotate(${(1 - a) * -20}deg)`;
  fx(w, l, 1.15, L - 0.5, { dy: 0, blur: 22, base: `translateX(${110}px)` });
}
function sceneEnd(id, line1, line2, small) {
  return `<div class="scene" id="${id}">
    <div class="orb abs" id="${id}o" style="left:600px;top:330px;width:170px;height:170px">${cMark(86)}</div>
    <div class="abs word" id="${id}w" style="left:810px;top:358px;font-size:118px">cercana<span class="dot">.</span></div>
    <p class="abs" id="${id}t" style="left:0;right:0;top:560px;text-align:center;font-size:44px;color:#334155">${line1}</p>
    <div class="abs" id="${id}u" style="left:0;right:0;top:660px;text-align:center"><span style="display:inline-block;padding:16px 44px;border-radius:999px;border:2px solid #1E3A7B;font-size:36px;font-weight:600;color:#1E3A7B;background:rgba(255,255,255,.6)">${line2}</span></div>
    <p class="abs cap" id="${id}s" style="left:0;right:0;top:770px;text-align:center;font-size:28px">${small}</p>
  </div>`;
}
function renderEnd(id, l) {
  fx($("#" + id + "o"), l, 0.1, null, { dy: 0, scale: 0.6 }); fx($("#" + id + "w"), l, 0.35, null, { dy: 0, blur: 20 });
  fx($("#" + id + "t"), l, 0.9, null); fx($("#" + id + "u"), l, 1.3, null); fx($("#" + id + "s"), l, 1.7, null);
}
function sceneConfirmed(id, title, sub, bgShot) {
  return `<div class="scene" id="${id}">
    ${bgShot ? `<div class="shot" id="${id}bg" style="left:260px;top:120px;width:1400px;opacity:.0"><img src="${bgShot}"/></div>` : ""}
    <div class="orb abs" id="${id}o" style="left:830px;top:300px;width:260px;height:260px;background:radial-gradient(circle at 35% 30%,#fff 0%,#DDF3E6 40%,#5BC48A 75%,#16964A 100%)">${svgCheck("#fff", 120)}</div>
    <h2 class="abs word" id="${id}h" style="left:0;right:0;top:610px;text-align:center;font-size:86px">${title}</h2>
    <p class="abs" id="${id}s" style="left:0;right:0;top:720px;text-align:center;font-size:38px;color:#475569">${sub}</p>
  </div>`;
}
function renderConfirmed(id, l, L) {
  const bg = $("#" + id + "bg"); if (bg) { bg.style.opacity = 0.18 * P(l, 0, 0.6) * (1 - ease((l - (L - 0.5)) / 0.5)); bg.style.filter = "blur(10px)"; }
  fx($("#" + id + "o"), l, 0.05, L - 0.5, { dy: 0, scale: 0.5, d: 0.6 }); fx($("#" + id + "h"), l, 0.4, L - 0.5); fx($("#" + id + "s"), l, 0.75, L - 0.5);
}
function sceneBenefits(id, items, shot, isPhone) {
  return `<div class="scene" id="${id}">
    ${isPhone ? `<div class="phone" id="${id}d" style="left:300px;top:110px;width:400px"><img src="${shot}"/></div>`
              : `<div class="shot" id="${id}d" style="left:120px;top:200px;width:980px"><img src="${shot}"/></div>`}
    ${items.map((x, i) => `<div class="abs" id="${id}p${i}" style="left:1190px;top:${330 + i * 130}px"><span class="pill" id="${id}q${i}">${x}</span></div>`).join("")}
  </div>`;
}
function renderBenefits(id, l, L, n, phone) {
  fx($("#" + id + "d"), l, 0.05, L - 0.5, { dy: 40, base: phone ? "perspective(1600px) rotateY(16deg) rotateX(4deg)" : "perspective(2000px) rotateY(18deg) rotateX(6deg)" });
  for (let i = 0; i < n; i++) {
    fx($("#" + id + "p" + i), l, 0.3 + i * 0.12, L - 0.5, { dy: 20 });
    const on = l > 0.7 + i * 0.75; $("#" + id + "q" + i).classList.toggle("on", on);
  }
}
function scenePeople(id, people, word) {
  return `<div class="scene" id="${id}">
    <svg class="abs" id="${id}line" width="1920" height="1080" style="left:0;top:0"><path id="${id}path" d="M520 520 C 760 300, 1160 300, 1400 520" fill="none" stroke="#1D4ED8" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 18" opacity=".55"/><circle id="${id}dot" r="12" fill="#1D4ED8"/></svg>
    ${people.map((p, i) => `<div class="avc" id="${id}a${i}" style="left:${p.x}px;top:${p.y}px;width:${p.s}px;height:${p.s}px"><img src="${p.src}"/></div><div class="label" id="${id}l${i}" style="left:${p.x}px;width:${p.s}px;top:${p.y + p.s + 30}px">${p.label}</div>`).join("")}
    <div class="abs kin" id="${id}k" style="left:0;right:0;top:860px;text-align:center;font-size:84px">${word}</div>
  </div>`;
}
function renderPeople(id, l, L, n, kinAt) {
  for (let i = 0; i < n; i++) { fx($("#" + id + "a" + i), l, 0.1 + i * 0.35, L - 0.5, { dy: 0, scale: 0.7, d: 0.9 }); fx($("#" + id + "l" + i), l, 0.5 + i * 0.35, L - 0.5, { dy: 12 }); }
  const path = $("#" + id + "path"), dot = $("#" + id + "dot"), len = path.getTotalLength();
  const k = P(l, 1.1, 1.6); const pt = path.getPointAtLength(len * k);
  dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y);
  $("#" + id + "line").style.opacity = P(l, 0.9, 0.5) * (1 - ease((l - (L - 0.5)) / 0.5));
  fx($("#" + id + "k"), l, kinAt, L - 0.5, { dy: 0, blur: 26, scale: 1.04 });
}

// ---------- map scenes (real photos on a real Miami map) ----------
const photo = (k) => `photos/${k}.jpg`;
function mapFrame(id, inner) {
  return `<div class="shot" id="${id}m" style="left:150px;top:90px;width:1620px;height:900px">
      <img src="photos/map.jpg" style="width:1920px;height:1080px;max-width:none;margin:-90px 0 0 -150px;filter:saturate(.6) brightness(1.03)"/>
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(243,246,251,.0),rgba(231,238,253,.35))"></div>
      ${inner}</div>`;
}
const pin = (id, k, x, y, s, ring = "#fff") => `<div class="avc" id="${id}" style="left:${x - s / 2}px;top:${y - s / 2}px;width:${s}px;height:${s}px;box-shadow:0 18px 40px -16px rgba(15,30,80,.55),0 0 0 6px ${ring}"><img src="${photo(k)}"/></div>`;

let SCENES = [];
if (VID === "agency") {
  // caregivers around the client (map-local coords; client at 810,450)
  const CG = [["c1", 470, 250], ["c2", 1150, 220], ["c3", 330, 560], ["xio", 1080, 660], ["c4", 1300, 470], ["c5", 600, 740], ["c6", 1240, 760], ["c7", 560, 380], ["c8", 900, 200], ["c9", 1450, 280]];
  SCENES = [
    { html: sceneOrb("s0"), r: (l, L) => renderOrb("s0", l, L) },
    { html: `<div class="scene" id="s1">${mapFrame("s1", `
        <div id="s1ring" style="position:absolute;left:810px;top:450px;width:0;height:0;border-radius:50%;border:3px solid rgba(29,78,216,.5);background:rgba(29,78,216,.06);transform:translate(-50%,-50%)"></div>
        ${CG.map(([k, x, y], i) => pin("s1g" + i, k, x, y, 96)).join("")}
        ${CG.map(([k, x, y], i) => `<span id="s1v${i}" style="position:absolute;left:${x + 26}px;top:${y + 22}px;width:26px;height:26px;border-radius:50%;background:#16964A;border:4px solid #fff;opacity:0"></span>`).join("")}
        ${pin("s1cl", "client", 810, 450, 150, "#1D4ED8")}
        <div class="chip" id="s1cll" style="position:absolute;left:700px;top:545px;font-weight:600">Sr. G. · HHA · Tue 8a</div>`)}
        <div class="chip abs" id="s1t1" style="left:90px;top:170px"><span style="width:14px;height:14px;border-radius:50%;background:#1D4ED8"></span>Not on your roster yet</div>
        <div class="chip abs" id="s1t2" style="left:1480px;top:150px">${svgCheck("#16964A", 28)} Credentials verified</div>
        <div class="chip abs" id="s1t3" style="left:1470px;top:880px"><span style="width:14px;height:14px;border-radius:50%;background:#16964A"></span>Available now · nearby</div>
      </div>`,
      r: (l, L) => { fx($("#s1m"), l, 0.05, L - 0.5, { dy: 40, base: "perspective(2600px) rotateX(10deg)" });
        const rr = P(l, 0.6, 2.4); const ring = $("#s1ring"); ring.style.width = ring.style.height = 1300 * rr + "px"; ring.style.opacity = (1 - rr) * 0.9 + 0.1;
        fx($("#s1cl"), l, 0.3, null, { dy: 0, scale: 0.6 }); fx($("#s1cll"), l, 0.6, null, { dy: 10 });
        CG.forEach((c, i) => { fx($("#s1g" + i), l, 0.9 + i * 0.22, null, { dy: 0, scale: 0.4, d: 0.5, blur: 8 }); $("#s1v" + i).style.opacity = P(l, 1.3 + i * 0.22, 0.3); });
        fx($("#s1t1"), l, 1.6, L - 0.5); fx($("#s1t2"), l, 2.6, L - 0.5); fx($("#s1t3"), l, 3.6, L - 0.5); } },
    { html: `<div class="scene" id="s2">
        <div class="phone" id="s2p" style="left:300px;top:90px;width:430px;height:900px;padding:40px 28px">
          <p class="cap" style="text-align:center">Cercana · text message</p>
          <div id="s2m1" style="margin-top:36px;background:#EEF1F5;border-radius:28px;border-bottom-left-radius:8px;padding:22px 26px;font-size:27px;line-height:1.35">Cercana: Turno HHA en Northside, mar 8a–2p, $18–20/h. Responde <b>1</b> para aceptar.</div>
          <div id="s2m2" style="margin:24px 0 0 auto;width:fit-content;background:#1D4ED8;color:#fff;border-radius:28px;border-bottom-right-radius:8px;padding:20px 30px;font-size:30px;font-weight:600">1</div>
          <div id="s2m3" style="margin-top:24px;background:#EEF1F5;border-radius:28px;border-bottom-left-radius:8px;padding:22px 26px;font-size:27px;line-height:1.35">¡Confirmado! Te enviamos la dirección.</div>
        </div>
        <div class="abs" style="left:860px;top:300px;display:flex;gap:28px" id="s2row">${["Text", "App", "English", "Español"].map((x, i) => `<span class="pill" id="s2q${i}">${x}</span>`).join("")}</div>
        <div class="chip abs" id="s2s" style="left:860px;top:500px;padding:14px 28px 14px 14px;font-size:28px"><img src="${photo("xio")}" style="width:72px;height:72px;border-radius:50%"/><span><b style="font-weight:600">Xiomara R.</b> said yes first<span class="cap" style="display:block">Offers to others closed automatically</span></span></div>
      </div>`,
      r: (l, L) => { fx($("#s2p"), l, 0.05, L - 0.5, { dy: 60, base: "perspective(1800px) rotateY(14deg)" }); fx($("#s2row"), l, 0.4, L - 0.5, { dy: 20 });
        const hi = Math.floor(Math.max(0, l - 0.9) / 0.6); [0, 1, 2, 3].forEach((i) => $("#s2q" + i).classList.toggle("on", hi === i || (hi >= 4 && (i === 0 || i === 3))));
        fx($("#s2m1"), l, 0.8, null, { dy: 16, blur: 0 }); fx($("#s2m2"), l, L - 2.4, null, { dy: 16, blur: 0 }); fx($("#s2m3"), l, L - 1.8, null, { dy: 16, blur: 0 }); fx($("#s2s"), l, L - 2.2, L - 0.5); } },
    { html: `<div class="scene" id="s3">
        ${pin("s3a", "xio", 560, 430, 230)}${pin("s3b", "client", 1360, 430, 230)}
        <div class="orb abs" id="s3o" style="left:860px;top:300px;width:200px;height:200px;background:radial-gradient(circle at 35% 30%,#fff 0%,#DDF3E6 40%,#5BC48A 75%,#16964A 100%)">${svgCheck("#fff", 96)}</div>
        <h2 class="abs word" id="s3h" style="left:0;right:0;top:620px;text-align:center;font-size:86px">Covered within minutes</h2>
        <p class="abs" id="s3s" style="left:0;right:0;top:730px;text-align:center;font-size:38px;color:#475569">Xiomara R. → Sr. G. · family notified</p>
      </div>`,
      r: (l, L) => { fx($("#s3a"), l, 0.05, L - 0.5, { dy: 0, scale: 0.7, base: `translateX(${80 * (1 - P(l, 0.05, 0.9))}px)` }); fx($("#s3b"), l, 0.05, L - 0.5, { dy: 0, scale: 0.7, base: `translateX(${-80 * (1 - P(l, 0.05, 0.9))}px)` });
        fx($("#s3o"), l, 0.35, L - 0.5, { dy: 0, scale: 0.5, d: 0.6 }); fx($("#s3h"), l, 0.6, L - 0.5); fx($("#s3s"), l, 0.95, L - 0.5); } },
    { html: sceneBenefits("s4", ["More caregivers", "Faster coverage", "Fewer calls"], "shots/today.png", false), r: (l, L) => renderBenefits("s4", l, L, 3, false) },
    { html: sceneEnd("s5", "Home care shifts, covered close by.", "cercana.ai", "For agencies · the first 50 get 6 months free"), r: (l) => renderEnd("s5", l) },
  ];
} else {
  const AG = [["Sunrise Home Health", 430, 230], ["Bayside Care Partners", 1190, 210], ["Golden Years Home Care", 300, 640], ["Northside Home Health", 1150, 640], ["Coral Care Services", 760, 790], ["Palm Home Aides", 1250, 410]];
  const bld = `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16"/><path d="M15 9h4a1 1 0 0 1 1 1v11"/><path d="M8 8h3M8 12h3M8 16h3M2 21h20"/></svg>`;
  SCENES = [
    { html: sceneOrb("s0"), r: (l, L) => renderOrb("s0", l, L) },
    { html: `<div class="scene" id="s1">${mapFrame("s1", `
        <svg width="1620" height="900" style="position:absolute;left:0;top:0">${AG.map(([n, x, y], i) => `<path id="s1ln${i}" d="M810 450 L ${x} ${y}" stroke="#1D4ED8" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round" fill="none" opacity="0"/>`).join("")}</svg>
        ${AG.map(([n, x, y], i) => `<div class="chip" id="s1a${i}" style="position:absolute;left:${x - 40}px;top:${y - 36}px;font-weight:500"><span style="width:52px;height:52px;border-radius:16px;background:#E7EEFD;display:grid;place-items:center">${bld}</span>${n}</div>`).join("")}
        ${pin("s1me", "maria", 810, 450, 170, "#1D4ED8")}
        <div class="chip" id="s1mel" style="position:absolute;left:715px;top:555px;font-weight:600">María L. · HHA</div>`)}
        <div class="chip abs" id="s1t1" style="left:90px;top:160px">One profile · every agency near you</div>
        <div class="chip abs" id="s1t2" style="left:1290px;top:870px"><span style="width:14px;height:14px;border-radius:50%;background:#16964A"></span>Sunrise Home Health viewed your profile</div>
      </div>`,
      r: (l, L) => { fx($("#s1m"), l, 0.05, L - 0.5, { dy: 40, base: "perspective(2600px) rotateX(10deg)" });
        fx($("#s1me"), l, 0.3, null, { dy: 0, scale: 0.6 }); fx($("#s1mel"), l, 0.6, null, { dy: 10 });
        AG.forEach((a, i) => { const k = P(l, 0.9 + i * 0.3, 0.6); $("#s1ln" + i).setAttribute("opacity", (0.55 * k).toFixed(2)); fx($("#s1a" + i), l, 1.0 + i * 0.3, null, { dy: 14, scale: 0.85, d: 0.5 }); });
        fx($("#s1t1"), l, 1.4, L - 0.5); fx($("#s1t2"), l, L - 1.8, L - 0.5); } },
    { html: `<div class="scene" id="s2">
        <div class="phone" id="s2p" style="left:1220px;top:60px;width:420px"><img src="shots/c-home.png"/></div>
